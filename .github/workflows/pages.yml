name: Deploy MyWinter Love Story to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fix scrapbook access gate
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- ACCESS-FIX-V2 -->'
          if marker not in s:
              patch = '''
<!-- ACCESS-FIX-V2 -->
<style id="access-fix-v2">
#passwordChoice,#v421Locked{display:none!important;visibility:hidden!important;pointer-events:none!important}
body.v421-locked{overflow:auto!important}
body.v421-locked > *{pointer-events:auto!important}
</style>
<script>
(function(){
  function unlock(){
    var p=document.getElementById('passwordChoice');
    var l=document.getElementById('v421Locked');
    if(p){p.style.display='none';p.setAttribute('aria-hidden','true');}
    if(l){l.classList.remove('show');l.style.display='none';l.setAttribute('aria-hidden','true');}
    document.body.classList.remove('v421-locked');
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',unlock,{once:true});
  else unlock();
  setTimeout(unlock,50);
  setTimeout(unlock,250);
})();
</script>
'''
              s += patch
              p.write_text(s, encoding='utf-8')
          else:
              print('Access fix already present; skipping.')

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
