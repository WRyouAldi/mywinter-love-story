<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f4f1"><title>MYWINTER / TIME MEMORY RELATION</title><link rel="stylesheet" href="design/time-memory-relation.css?v=1"></head>
<body><main id="app"></main>
<script type="module">
import{buildTimeMemoryRelation,findByQuery}from'./app/time-memory-relation.js';const app=document.querySelector('#app');let memories=[],index=0,touchX=0;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const current=()=>memories[index]||{};
function render(){const m=current();app.innerHTML=`<div class="tmr"><header class="tmr-head"><span>MYWINTER / 002</span><span>TIME / MEMORY / RELATION</span></header><section class="tmr-time"><div class="tmr-axis"></div><article class="tmr-memory" id="memory"><div class="tmr-index">${String(index+1).padStart(3,'0')} / ${String(memories.length).padStart(3,'0')}</div><div class="tmr-date">${esc(day(m.date))}<small>${esc(restDate(m.date))}</small></div><div class="tmr-dot"></div><div class="tmr-text">${esc(m.text||'')}</div><div class="tmr-meta">${esc([m.time,m.sender,m.type,m.mood].filter(Boolean).join(' / '))}</div></article><div class="tmr-hint">SWIPE ← → TO MOVE · TAP TO OPEN CONTEXT</div><input id="search" class="tmr-search" placeholder="FIND MEMORY"><div class="tmr-context" id="context"><button class="tmr-close" id="close">CLOSE ×</button><div class="tmr-context-inner"><div class="tmr-meta">${esc(m.timestamp||m.date)} / ${esc(m.type||'MEMORY')}</div><h2>${esc(m.text||'')}</h2><div class="tmr-thread">${thread(m)}</div></div></div></section><footer class="tmr-foot"><span>DATA / PRESERVED</span><span>${esc(m.relation?.length||0)} RELATIONS</span><span>V2 / TIME SYSTEM</span></footer></div>`;document.querySelector('#memory').onclick=e=>{if(!e.target.closest('#search'))document.querySelector('#context').classList.add('open')};document.querySelector('#close').onclick=()=>document.querySelector('#context').classList.remove('open');document.querySelector('#search').onkeydown=e=>{if(e.key==='Enter'){const found=findByQuery(memories,e.target.value);if(found.length){index=memories.indexOf(found[0]);render()}}}}
function thread(m){const c=Array.isArray(m.context)?m.context:[];return(c.length?c:[m]).map(x=>`<div class="tmr-msg"><time>${esc(x.time||'--:--')}</time><p>${esc(typeof x==='string'?x:(x.text||x.body||''))}</p></div>`).join('')};function day(d){const s=String(d||'').match(/\d{1,2}/);return s?s[0]:'—'}function restDate(d){return String(d||'').replace(/^\s*\d{1,2}\s*/,'').trim().toUpperCase()||'MEMORY'}function move(n){if(memories.length){index=(index+n+memories.length)%memories.length;render()}}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowUp')document.querySelector('#context')?.classList.add('open');if(e.key==='Escape')document.querySelector('#context')?.classList.remove('open')});document.addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>55)move(dx<0?1:-1)},{passive:true});async function boot(){try{const r=await fetch('./data/memories.json?v=tmr1',{cache:'no-store'});if(!r.ok)throw Error();memories=buildTimeMemoryRelation(await r.json())}catch{memories=[{id:'origin',date:'27 November 2025',text:'OUR STORY BEGAN HERE',type:'ORIGIN',mood:'MEMORY',context:[],relatedMemories:[]}]};render()}boot();
</script></body></html>
