<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2eee7"><title>MyWinter — A Living Memory</title><link rel="stylesheet" href="design/tokens.css"></head><body><button class="v2-index" id="libraryBtn">Memory Library</button><button class="v2-keep" id="keep" aria-label="Keep this memory">♡</button><main id="app"></main><div class="v2-toast" id="toast"></div><script type="module">
import{createMemoryStore,getRelatedMemories}from'./app/memory-engine.js';const app=document.querySelector('#app'),toast=document.querySelector('#toast'),keep=document.querySelector('#keep');let store=createMemoryStore({all:[]}),memories=[],index=0,view='opening',touchY=0,loved=new Set(JSON.parse(localStorage.getItem('mywinter-v2-favorites')||'[]'));const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const current=()=>memories[index]||memories[0];
function opening(){view='opening';app.innerHTML=`<section class="v2-page v2-opening"><div><div class="v2-opening__mark">MyWinter · A living memory</div><div class="v2-opening__date">27<small>NOVEMBER · 2025</small></div><div class="v2-opening__line"></div><p class="v2-opening__copy">Some stories begin quietly.<br>Ours became a collection of little things.</p><button class="turn" id="enter">Turn the page →</button></div></section>`;document.querySelector('#enter').onclick=fragment}
function fragment(){view='fragment';const m=current();app.innerHTML=`<section class="v2-page v2-fragment-stage"><div><button class="v2-fragment" id="fragment"><span class="v2-fragment__date">${esc(m.date)}</span><span class="v2-fragment__quote">“${esc(m.text||'A little memory.') }”</span><span class="v2-fragment__meta">${esc([m.time,m.sender].filter(Boolean).join(' · ')||'a moment worth keeping')}</span><span class="v2-fragment__number">${String(index+1).padStart(2,'0')}</span></button><div class="v2-instruction">Tap to reveal · swipe left/right for another fragment</div></div></section>`;document.querySelector('#fragment').onclick=reveal;syncKeep()}
function reveal(){view='reveal';const m=current(),rel=getRelatedMemories(store,m,3);const context=m.context||[];app.innerHTML=`<section class="v2-page v2-reveal"><div class="v2-reveal__inner"><div class="v2-reveal__eyebrow">${esc(m.date)} · ${esc(m.type||'memory')}</div><h2>“${esc(m.text||'A little memory.') }”</h2><div class="v2-reveal__meta">${esc([m.time,m.sender,m.mood].filter(Boolean).join(' · '))}</div><div class="v2-context"><div class="v2-reveal__eyebrow">The moment</div><p>${context.length?esc(typeof context[0]==='string'?context[0]:(context[0].text||context[0].body||'')):'A small moment, kept exactly where it belongs.'}</p></div><div class="v2-actions"><button class="v2-link" id="conversation">See conversation →</button><button class="v2-link" id="next">Next fragment →</button></div>${rel.length?`<div class="v2-context"><div class="v2-reveal__eyebrow">Nearby memories</div>${rel.map(r=>`<button class="v2-link" data-related="${esc(r.id)}" style="margin:18px 18px 0 0">${esc(r.date)} · ${esc((r.text||'').slice(0,48))} →</button>`).join('')}</div>`:''}</div></section>`;document.querySelector('#conversation').onclick=conversation;document.querySelector('#next').onclick=next;document.querySelectorAll('[data-related]').forEach(b=>b.onclick=()=>{const i=memories.findIndex(x=>x.id===b.dataset.related);if(i>=0){index=i;fragment()}});syncKeep()}
function conversation(){view='conversation';const m=current(),ctx=Array.isArray(m.context)?m.context:[];app.innerHTML=`<section class="v2-page v2-reveal"><div class="v2-reveal__inner"><div class="v2-reveal__eyebrow">Conversation context</div><h2>${esc(m.date)}</h2><div class="v2-conversation">${(ctx.length?ctx:[m]).map(x=>`<div class="v2-message"><time>${esc(x.time||'')}</time><p>${esc(typeof x==='string'?x:(x.text||x.body||''))}</p></div>`).join('')}</div><div class="v2-actions"><button class="v2-link" id="back">← Back to fragment</button><button class="v2-link" id="next">Next fragment →</button></div></div></section>`;document.querySelector('#back').onclick=reveal;document.querySelector('#next').onclick=next}
function next(){if(!memories.length)return;index=(index+1)%memories.length;fragment()}
function syncKeep(){const id=current()?.id;keep.textContent=loved.has(id)?'♥':'♡';keep.classList.toggle('is-kept',loved.has(id))}
function library(){view='library';app.innerHTML=`<section class="v2-page v2-library"><div class="v2-shell"><div class="v2-opening__mark">Memory Library</div><h2>Find a memory.</h2><input class="v2-search" id="search" placeholder="Type a word, date, name…"><div id="results" style="margin-top:42px"></div></div></section>`;const s=document.querySelector('#search'),r=document.querySelector('#results');const draw=q=>{const rows=store.all.filter(x=>[x.text,x.date,x.sender,x.type,x.mood,...(x.keywords||[])].join(' ').toLowerCase().includes(q.toLowerCase())).slice(0,30);r.innerHTML=rows.length?rows.map(x=>`<button class="v2-result" data-id="${esc(x.id)}"><span class="v2-result__date">${esc(x.date)}</span><span class="v2-result__quote">“${esc(x.text||'')}”</span></button>`).join(''):'<p style="color:var(--ink-soft)">No memory found.</p>';r.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const i=memories.findIndex(x=>x.id===b.dataset.id);if(i>=0)index=i;fragment()})};s.oninput=e=>draw(e.target.value);draw('');s.focus()}
keep.onclick=()=>{const id=current()?.id;if(loved.has(id))loved.delete(id);else loved.add(id);localStorage.setItem('mywinter-v2-favorites',JSON.stringify([...loved]));syncKeep();toast.textContent=loved.has(id)?'Memory kept':'Memory released';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)};document.querySelector('#libraryBtn').onclick=library;document.addEventListener('keydown',e=>{if(view==='fragment'||view==='reveal'){if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft'){index=(index-1+memories.length)%memories.length;fragment()}if(e.key==='ArrowUp')reveal();if(e.key==='ArrowDown')fragment();}});document.addEventListener('touchstart',e=>touchY=e.changedTouches[0].clientY,{passive:true});document.addEventListener('touchend',e=>{const dy=e.changedTouches[0].clientY-touchY;if(Math.abs(dy)>55){if(dy<0)reveal();else fragment()}},{passive:true});async function boot(){try{const r=await fetch('./data/memories.json?v=2',{cache:'no-store'});if(!r.ok)throw 0;store=createMemoryStore(await r.json())}catch{}memories=store.all.length?store.all:[{id:'origin',date:'27 November 2025',text:'Our story began quietly.',type:'origin',mood:'love',importance:100,context:[]}];opening()}boot();
</script></body></html>
