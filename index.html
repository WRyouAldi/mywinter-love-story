<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f5"><title>MYWINTER / MEMORY SYSTEM</title><link rel="stylesheet" href="design/tokens.css?v=3"></head><body><button class="v2-index" id="libraryBtn">LIBRARY / 01</button><button class="v2-keep" id="keep" aria-label="Keep memory">KEEP ♡</button><main id="app"></main><div class="v2-toast" id="toast"></div><script type="module">import{createMemoryStore,getRelatedMemories}from'./app/memory-engine.js';const app=document.querySelector('#app'),toast=document.querySelector('#toast'),keep=document.querySelector('#keep');let store=createMemoryStore({all:[]}),memories=[],index=0,view='opening',touchY=0,loved=new Set(JSON.parse(localStorage.getItem('mywinter-v2-favorites')||'[]'));const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const current=()=>memories[index]||memories[0];function opening(){view='opening';app.innerHTML=`<section class="v2-page v2-opening"><div class="v2-opening__top"><span>MYWINTER / 002</span><span>MEMORY SYSTEM</span></div><div class="v2-opening__core"><div class="v2-opening__date">27<small>27 NOV 2025 / ORIGIN</small></div><p class="v2-opening__copy">A relationship is not a timeline. It is a system of moments, words, habits and things only two people remember.</p><button class="turn" id="enter">ENTER THE SYSTEM →</button></div><div class="v2-opening__footer"><span>DATA / PRESERVED</span><span>INTERFACE / V2</span><span>V1 / DISCONNECTED</span></div></section>`;document.querySelector('#enter').onclick=fragment}function fragment(){view='fragment';const m=current();app.innerHTML=`<section class="v2-page v2-fragment-stage"><div><button class="v2-fragment" id="fragment"><span class="v2-fragment__date">${esc(m.date)} / ${esc(m.type||'MEMORY')}</span><span class="v2-fragment__quote">${esc(m.text||'A LITTLE MEMORY')}</span><span class="v2-fragment__meta">${esc([m.time,m.sender].filter(Boolean).join(' / ')||'ORIGINAL MEMORY DATA')}</span><span class="v2-fragment__number">${String(index+1).padStart(2,'0')}</span></button><div class="v2-instruction">TAP TO OPEN / SWIPE TO MOVE</div></div></section>`;document.querySelector('#fragment').onclick=reveal;syncKeep()}function reveal(){view='reveal';const m=current(),rel=getRelatedMemories(store,m,3),context=m.context||[];app.innerHTML=`<section class="v2-page v2-reveal"><div class="v2-reveal__inner"><div class="v2-reveal__eyebrow">${esc(m.date)} / ${esc(m.type||'MEMORY')} / ${String(index+1).padStart(2,'0')}</div><h2>${esc(m.text||'A LITTLE MEMORY')}</h2><div class="v2-reveal__meta">${esc([m.time,m.sender,m.mood].filter(Boolean).join(' / '))}</div><div class="v2-context"><div class="v2-reveal__eyebrow">MOMENT / CONTEXT</div><p>${context.length?esc(typeof context[0]==='string'?context[0]:(context[0].text||context[0].body||'')):'THE DATABASE HOLDS THE MOMENT. OPEN THE CONVERSATION TO SEE ITS CONTEXT.'}</p></div><div class="v2-actions"><button class="v2-link" id="conversation">OPEN CONVERSATION →</button><button class="v2-link" id="next">NEXT MEMORY →</button></div>${rel.length?`<div class="v2-context"><div class="v2-reveal__eyebrow">CONNECTED / ${rel.length}</div>${rel.map(r=>`<button class="v2-link" data-related="${esc(r.id)}">${esc((r.date||'').toUpperCase())} / ${esc((r.text||'').slice(0,55))} →</button>`).join(' ')}</div>`:''}</div></section>`;document.querySelector('#conversation').onclick=conversation;document.querySelector('#next').onclick=next;document.querySelectorAll('[data-related]').forEach(b=>b.onclick=()=>{const i=memories.findIndex(x=>x.id===b.dataset.related);if(i>=0){index=i;fragment()}});syncKeep()}function conversation(){view='conversation';const m=current(),ctx=Array.isArray(m.context)?m.context:[];app.innerHTML=`<section class="v2-page v2-reveal"><div class="v2-reveal__inner"><div class="v2-reveal__eyebrow">RAW CONVERSATION / ${esc(m.date)}</div><h2>THE THREAD</h2><div class="v2-conversation">${(ctx.length?ctx:[m]).map(x=>`<div class="v2-message"><time>${esc(x.time||'--:--')}</time><p>${esc(typeof x==='string'?x:(x.text||x.body||''))}</p></div>`).join('')}</div><div class="v2-actions"><button class="v2-link" id="back">← MEMORY</button><button class="v2-link" id="next">NEXT →</button></div></div></section>`;document.querySelector('#back').onclick=reveal;document.querySelector('#next').onclick=next}function next(){if(!memories.length)return;index=(index+1)%memories.length;fragment()}function syncKeep(){const id=current()?.id;keep.textContent=loved.has(id)?'KEEPED ♥':'KEEP ♡';keep.classList.toggle('is-kept',loved.has(id))}function library(){view='library';app.innerHTML=`<section class="v2-page v2-library"><div class="v2-shell"><div class="v2-opening__mark">MEMORY LIBRARY / 01</div><h2>FIND<br>A MEMORY.</h2><input class="v2-search" id="search" placeholder="SEARCH WORD / DATE / NAME / MOOD"><div id="results" style="margin-top:42px"></div></div></section>`;const s=document.querySelector('#search'),r=document.querySelector('#results'),draw=q=>{const rows=store.all.filter(x=>[x.text,x.date,x.sender,x.type,x.mood,...(x.keywords||[])].join(' ').toLowerCase().includes(q.toLowerCase())).slice(0,30);r.innerHTML=rows.length?rows.map(x=>`<button class="v2-result" data-id="${esc(x.id)}"><span class="v2-result__date">${esc(x.date)} / ${esc(x.type||'MEMORY')}</span><span class="v2-result__quote">${esc(x.text||'')}</span></button>`).join(''):'<p style="font:700 10px var(--mono)">NO RESULT.</p>';r.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const i=memories.findIndex(x=>x.id===b.dataset.id);if(i>=0)index=i;fragment()})};s.oninput=e=>draw(e.target.value);draw('');s.focus()}keep.onclick=()=>{const id=current()?.id;if(loved.has(id))loved.delete(id);else loved.add(id);localStorage.setItem('mywinter-v2-favorites',JSON.stringify([...loved]));syncKeep();toast.textContent=loved.has(id)?'MEMORY KEPT':'MEMORY RELEASED';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)};document.querySelector('#libraryBtn').onclick=library;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&view!=='opening')opening();if(view==='fragment'||view==='reveal'){if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft'){index=(index-1+memories.length)%memories.length;fragment()}if(e.key==='ArrowUp')reveal();if(e.key==='ArrowDown')fragment()}});document.addEventListener('touchstart',e=>touchY=e.changedTouches[0].clientY,{passive:true});document.addEventListener('touchend',e=>{const dy=e.changedTouches[0].clientY-touchY;if(Math.abs(dy)>55){if(dy<0)reveal();else fragment()}},{passive:true});async function boot(){try{const r=await fetch('./data/memories.json?v=3',{cache:'no-store'});if(!r.ok)throw 0;store=createMemoryStore(await r.json())}catch{}memories=store.all.length?store.all:[{id:'origin',date:'27 November 2025',text:'OUR STORY BEGAN HERE',type:'ORIGIN',mood:'LOVE',importance:100,context:[]}];opening()}boot();</script></body></html>
